name: V-CORE Build Engine (Linux Resonance)
on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space (Resonance Prep)
        run: |
          # Удаление тяжеловесных предустановленных пакетов для освобождения места
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          echo "Свободное место после очистки:"
          df -h /

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'
          method: 'local'
          # Ставим только ядро компиляции, чтобы не забить диск снова
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Configure CMake
        run: |
          mkdir build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="all"

      - name: Build VCORE Engine
        run: |
          cmake --build build --config Release -j $(nproc)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCORE_v144_Engine_Linux
          path: build/vcore_engine
