name: V-CORE Build Engine (Linux Resonance)
on: [push]

jobs:
  build-linux:
    # МЕНЯЕМ НА 22.04 для стабильности путей NVIDIA
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'
          # Используем локальный метод, он надежнее в CI
          method: 'local'

      - name: Configure CMake
        run: |
          mkdir build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="all"

      - name: Build VCORE Engine
        run: |
          cmake --build build --config Release -j $(nproc)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCORE_v144_Engine_Linux
          path: build/vcore_engine
