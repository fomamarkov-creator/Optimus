name: V-CORE Build Engine
on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA
        # Используем обновленный экшен, который точно доступен
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'
          method: 'network'

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VCORE Engine
        run: cmake --build build --config Release

      - name: Upload Artifact
        # Обновили до v4, чтобы убрать ошибку депрекации
        uses: actions/upload-artifact@v4
        with:
          name: VCORE_v144_Engine_Win64
          path: build/Release/vcore_engine.exe
