name: V-CORE Build Engine
on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'
          method: 'network'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and Build
        shell: pwsh
        run: |
          # 1. Находим путь к CUDA
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.1"
          $env:PATH = "$cudaPath\bin;$env:PATH"
          
          # 2. Конфигурируем через NMake (он стабильнее в CI)
          cmake -S . -B build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_COMPILER="$cudaPath\bin\nvcc.exe" `
            -DCMAKE_CUDA_ARCHITECTURES="all"

          # 3. Собираем
          cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCORE_v144_Engine_Win64
          path: build/vcore_engine.exe
