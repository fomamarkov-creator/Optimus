name: V-CORE Build Engine (Linux Resonance)
on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    # Добавляем права на запись, чтобы билд мог создавать релизы
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space (Resonance Prep)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get clean
          df -h /

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'
          method: 'network'

      - name: Configure CMake
        run: |
          mkdir build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="all"

      - name: Build VCORE Engine
        run: |
          cmake --build build --config Release -j $(nproc)

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v144-build-${{ github.run_number }}
          name: VCORE Engine Build v144 (Run ${{ github.run_number }})
          files: build/libvcore_engine.so
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
